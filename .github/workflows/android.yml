# =============================================================================
# MC互通管家 · Android APK 自动构建
# 触发：
#   * push tag  v*.*.*  -> 构建并上传到 GitHub Release
#   * workflow_dispatch  -> 手动触发，只上传 artifact（方便自测）
#
# 使用 kivy/buildozer 官方 Docker 镜像构建：
#   - 镜像内置完整工具链（SDK/NDK/autoconf/libtool 兼容版本）
#   - 避免 Ubuntu 24.04 上 autoconf 2.72 与 libffi autogen 的兼容性问题
# =============================================================================
name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备打包目录（把核心库拷进 android/）
        run: |
          cd android
          cp -r ../mcbridge ./mcbridge
          ls -la

      - name: 缓存 buildozer 构建产物（SDK/NDK/依赖）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-docker-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-docker-

      - name: 构建 debug APK（Docker）
        working-directory: android
        run: |
          set +e
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -e ACCEPT_SDK_LICENSE=yes \
            kivy/buildozer:latest \
            android debug > /tmp/bz.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Android build failed (rc=$rc)"
            echo "===== 关键错误 ====="
            grep -nE "ErrorReturnCode|RAN:|Command failed|error:|Error|Traceback|No such file|not found|Unable" /tmp/bz.log | tail -25
            echo "===== 日志最后 40 行 ====="
            tail -40 /tmp/bz.log
            exit $rc
          fi

      - name: 列出产物
        run: ls -la android/bin/

      - name: 上传 APK 为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcbridge-android-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bin/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
