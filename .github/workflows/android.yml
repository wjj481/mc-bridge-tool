# =============================================================================
# MC互通管家 · Android APK 自动构建
# 触发：
#   * push tag  v*.*.*  -> 构建并上传到 GitHub Release
#   * workflow_dispatch  -> 手动触发，只上传 artifact（方便自测）
# =============================================================================
name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装系统依赖（buildozer 所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 buildozer / python-for-android / cython
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer cython==0.29.36

      - name: 准备打包目录（把核心库拷进 android/）
        run: |
          cd android
          cp -r ../mcbridge ./mcbridge
          ls -la

      - name: 缓存 buildozer 构建产物（SDK/NDK/依赖）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 构建 debug APK
        working-directory: android
        run: buildozer -v android debug
        env:
          # 自动接受 Android SDK 许可
          ANDROID_HOME: ${{ github.workspace }}/android/.buildozer/android/platform/android-sdk
          ACCEPT_SDK_LICENSE: "yes"

      - name: 列出产物
        run: ls -la android/bin/

      - name: 上传 APK 为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcbridge-android-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bin/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
