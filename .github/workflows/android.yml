# =============================================================================
# MC互通管家 · Android APK 自动构建
# 触发：
#   * push tag  v*.*.*  -> 构建并上传到 GitHub Release
#   * workflow_dispatch  -> 手动触发，只上传 artifact（方便自测）
# =============================================================================
name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装系统依赖（buildozer 所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: 安装旧版 autoconf 2.69（兼容 libffi autogen）
        run: |
          # Ubuntu 24.04 自带 autoconf 2.72，与 python-for-android 内置 libffi 3.3 的
          # autogen.sh 不兼容（AC_PROG_LD 等宏在 2.72 中报错）。编译安装 2.69。
          cd /tmp
          curl -sL https://ftp.gnu.org/gnu/autoconf/autoconf-2.69.tar.gz -o autoconf-2.69.tar.gz
          tar xzf autoconf-2.69.tar.gz
          cd autoconf-2.69
          ./configure --prefix=/usr > /dev/null 2>&1
          make -s -j2
          sudo make install > /dev/null 2>&1
          autoconf --version | head -1

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 buildozer / python-for-android / cython
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer cython==0.29.36
          # 显式安装 python-for-android（buildozer 首次运行时才按需克隆，
          # 这里提前装好以便 patch libffi recipe）
          pip install python-for-android

      - name: 准备打包目录（把核心库拷进 android/）
        run: |
          cd android
          cp -r ../mcbridge ./mcbridge
          ls -la

      - name: 缓存 buildozer 构建产物（SDK/NDK/依赖）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 构建 debug APK
        working-directory: android
        run: |
          # 修复 libffi：源码自带 configure，跳过 autogen.sh（autoconf 兼容问题）
          RECIPE=$(python3 -c "import pathlib, pythonforandroid; print(pathlib.Path(pythonforandroid.__file__).parent/'recipes'/'libffi'/'__init__.py')")
          echo "libffi recipe: $RECIPE"
          python3 - "$RECIPE" << 'EOF'
          import sys, re
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          new = re.sub(
              r'^(\s*)sh\.call\(\[\s*["\']\.?/autogen\.sh["\']\s*\]\s*,\s*\*args,\s*\*\*kwargs\s*\)\s*$',
              r'\1pass  # autogen skipped (autoconf compat)',
              s, flags=re.M)
          changed = new != s
          p.write_text(new)
          print('libffi recipe patched:', changed)
          EOF
          set +e
          buildozer -v android debug > /tmp/bz.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "===== BUILD FAILED, 关键错误 ====="
            grep -nE "ErrorReturnCode|RAN:|error:|Error|failed|Traceback|No such file|not found|Unable" /tmp/bz.log | tail -30
            echo "===== 日志最后 60 行 ====="
            tail -60 /tmp/bz.log
            exit $rc
          fi
        env:
          # 自动接受 Android SDK 许可
          ANDROID_HOME: ${{ github.workspace }}/android/.buildozer/android/platform/android-sdk
          ACCEPT_SDK_LICENSE: "yes"

      - name: 列出产物
        run: ls -la android/bin/

      - name: 上传 APK 为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcbridge-android-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bin/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
